name: CI

permissions:
  contents: write

on:
  push:
  pull_request:

jobs:
  test:
    name: node-${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (no runtime deps)
        run: npm install --no-audit --no-fund
      - name: Lint / architecture guards
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: End-to-end selftest
        shell: bash
        run: |
          set +e
          bash scripts/selftest.sh 2>&1 | tee selftest.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            FAILS=$(grep -n '❌' selftest.log | tail -20 || true)
            if [ -z "$FAILS" ]; then FAILS=$(tail -20 selftest.log); fi
            MSG=$(printf '%s\n' "$FAILS" | tr '\n' ' ' | cut -c1-4000)
            echo "::error::selftest（$(wc -l < selftest.log) 行）：$MSG"
          fi
          exit "$STATUS"
        env:
          NODE_BIN: node
      - name: Upload macOS selftest log (diagnostic)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          git config user.name "ci-diag"
          git config user.email "ci-diag@example.invalid"
          [ -f selftest.log ] || echo "selftest.log missing" > selftest.log
          BR="ci-diag-${GITHUB_RUN_ID}-${RUNNER_OS}-${GITHUB_JOB}"
          git checkout -b "$BR"
          git add -f selftest.log
          git commit -m "ci diag [skip ci]"
          git push origin "HEAD:$BR"

  windows:
    name: windows / node-22 (unit + lint + pack)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (no runtime deps)
        run: npm install --no-audit --no-fund
      - name: Lint / architecture guards
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Package smoke (npm pack)
        run: npm pack --dry-run
